<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReelBook — Favoritos</title>
  <link rel="icon" href="../assets/images/logo-icon.png" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body data-page="listas" data-basepath="../">
  <!-- data-page="listas" só para destacar o mesmo item de menu; ajustar se
       Favoritos ganhar um link próprio na navbar no futuro -->

  <header id="app-navbar" class="navbar container"></header>

  <!--
    Estella esta tela está com o layout pronto e dados falsos.
    Falta implementar:
      - salvar/remover favoritos de verdade (banco de dados)
      - o botão "×" em cada card hoje não faz nada
      - estado vazio real quando o usuário não tiver favoritos
  -->
  <main id="main-conteudo" class="container section">
    <h2>Meus favoritos</h2>
    <p class="text-muted" id="favoritos-contador" style="margin-top:4px;"></p>

    <div id="favoritos-grid" class="movie-grid" style="margin-top:32px;"></div>
  </main>

  <footer class="footer container">
    <p class="text-faint">© 2026 ReelBook — Projeto acadêmico.</p>
  </footer>

  <script src="../js/components.js"></script>
  <script src="../js/main.js"></script>
  <script>
    // essa tela exige "login".
    // substituir MOCK_MOVIES pelos favoritos reais do usuário.
    document.addEventListener('DOMContentLoaded', () => {
      const logado = protegerPagina('main-conteudo', '../');
      if (!logado) return;

      renderMovieGrid(document.getElementById('favoritos-grid'), MOCK_MOVIES, '../');
      document.getElementById('favoritos-contador').textContent = `${MOCK_MOVIES.length} filmes`;
    });
  </script>
</body>
</html>
